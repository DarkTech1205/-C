name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: ubuntu-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          combine: true
          target: ${{ matrix.config.target }}

                - name: List all geode-deps headers (debug)
        if: always()
        shell: bash
        run: find . -path "*geode-deps*" -type f 2>/dev/null | head -200

      - name: List object-collab headers (debug)
        if: always()
        shell: bash
        run: find . -ipath "*object-collab*" 2>/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.build-output-name }}
          path: ${{ steps.build.outputs.build-output-path }}

  combine:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Combine into one .geode
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          artifacts: build-artifacts

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.combine.outputs.build-output-name }}
          path: ${{ steps.combine.outputs.build-output-path }}
